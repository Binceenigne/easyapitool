<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e7f0f4">
  <title>DJYX IMGGEN Android</title>
  <style>
    :root { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; color: #102a32; background: #e7f0f4; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: linear-gradient(135deg, #e7f0f4 0%, #f7f5ec 58%, #dce9df 100%); }
    main { width: min(620px, 100%); border: 1px solid #8aa6a5; background: #fffefa; box-shadow: 8px 8px 0 #102a32; padding: clamp(28px, 6vw, 54px); }
    header { border-bottom: 2px solid #102a32; padding-bottom: 20px; }
    h1 { margin: 0; font-size: 32px; font-weight: 800; letter-spacing: 0; }
    p { margin: 10px 0 0; color: #416166; line-height: 1.65; }
    #release { margin: 28px 0 20px; min-height: 60px; font-size: 15px; line-height: 1.7; }
    .download { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 22px; border: 2px solid #102a32; color: #fffefa; background: #d44f32; font-weight: 700; text-decoration: none; }
    .download:focus-visible, .download:hover { outline: 3px solid #d7a127; outline-offset: 3px; }
    footer { margin-top: 28px; color: #5d7475; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>DJYX IMGGEN</h1>
      <p>Android 安装包与应用更新服务</p>
    </header>
    <div id="release">正在读取最新发布版本。</div>
    <a class="download" href="/v1/app/update/download?platform=android">下载 Android APK</a>
    <footer>下载完成后请在 Android 系统安装器中确认安装。</footer>
  </main>
  <script>
    fetch('/v1/app/update?platform=android&currentVersionCode=0&currentBuildTimestampMs=0', { cache: 'no-store' })
      .then(response => response.ok ? response.json() : Promise.reject())
      .then(release => {
        const time = release.latestBuildTime ? new Date(release.latestBuildTime).toLocaleString('zh-CN') : '未知';
        document.getElementById('release').textContent = `当前发布 v${release.latestVersion} · 构建时间 ${time} · ${(release.downloadSize / 1048576).toFixed(1)} MB`;
      })
      .catch(() => { document.getElementById('release').textContent = '发布信息暂不可用，请稍后重试。'; });
  </script>
</body>
</html>
