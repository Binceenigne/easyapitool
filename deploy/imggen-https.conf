server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name imggen.djyx.me;

    root /www/wwwroot/imggen.djyx.me;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/imggen.djyx.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/imggen.djyx.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location = /.well-known/assetlinks.json {
        alias /www/wwwroot/imggen.djyx.me/.well-known/assetlinks.json;
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location = /v1 {
        return 308 /v1/;
    }

    location = /v1/app {
        return 302 /;
    }

    location ^~ /v1/ {
        client_max_body_size 60m;
        proxy_pass http://127.0.0.1:8766/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 15s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location ^~ /easyapitool-api/ {
        return 404;
    }

    location / {
        try_files $uri /index.html =404;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location ~ ^/(\.user\.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README\.md) {
        return 404;
    }

    access_log /www/wwwlogs/imggen.djyx.me.ssl.log;
    error_log /www/wwwlogs/imggen.djyx.me.ssl.error.log;
}