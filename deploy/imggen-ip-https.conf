server {
    # TLS clients rarely send SNI for an IP address. Named HTTPS hosts retain
    # their own certificates through normal SNI selection.
    listen 443 ssl default_server;
    http2 on;
    server_name 39.105.74.222;

    ssl_certificate /etc/mirra-ip-certs/live/mirra-ip/fullchain.pem;
    ssl_certificate_key /etc/mirra-ip-certs/live/mirra-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    root /www/wwwroot/imggen.djyx.me;
    index index.html;
    access_log /www/wwwlogs/mirra-ip.access.log;
    error_log /www/wwwlogs/mirra-ip.error.log;

    include /etc/imggen-gateway/openai-location.conf;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /healthz {
        proxy_pass http://127.0.0.1:8767/healthz;
    }

    location = /readyz {
        proxy_pass http://127.0.0.1:8767/readyz;
    }

    location = /v1/app { return 302 /; }

    location = /v1/app/update/download {
        proxy_pass http://127.0.0.1:8767/api/v1/app/update/download;
        proxy_force_ranges on;
    }

    location ^~ /v1/ {
        client_max_body_size 60m;
        proxy_pass http://127.0.0.1:8767/api/v1/;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 15s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }

    location ~ (^|/)\. { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
