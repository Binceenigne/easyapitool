server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name clife.djyx.me;

    root /www/wwwroot/clife.djyx.me;
    index index.php index.html index.htm default.php default.htm default.html;

    ssl_certificate /etc/letsencrypt/live/clife.djyx.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clife.djyx.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location = /.well-known/assetlinks.json {
        alias /www/wwwroot/clife.djyx.me/.well-known/assetlinks.json;
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location ^~ /app/ {
        alias /www/wwwroot/clife.djyx.me/easyapitool-app/;
        try_files $uri /index.html =404;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location ^~ /easyapitool-api/ {
        client_max_body_size 60m;
        proxy_pass http://127.0.0.1:8765/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 15s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location = /webhook {
        proxy_pass http://127.0.0.1:9000/webhook;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location ^~ / {
        proxy_pass http://127.0.0.1:1217/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Real-Port $remote_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header REMOTE-HOST $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location ~ ^/(\.user\.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README\.md) {
        return 404;
    }

    access_log /www/wwwlogs/clife.djyx.me.ssl.log;
    error_log /www/wwwlogs/clife.djyx.me.ssl.error.log;
}