# Include in the existing HTTPS server. Send /v1/ and health checks to port 8767
# after verifying the gateway and both release manifests on the local port.
location ^~ /openai/v1/ {
    client_max_body_size 825m;
    proxy_pass http://127.0.0.1:8767/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_connect_timeout 15s;
    proxy_send_timeout 900s;
    proxy_read_timeout 900s;
    add_header Strict-Transport-Security "max-age=31536000" always;
}
